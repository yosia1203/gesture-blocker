<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; color: #222; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .host { font-weight: 600; word-break: break-all; margin-bottom: 8px; }
    label { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
    h2 { font-size: 12px; text-transform: uppercase; color: #777; margin: 16px 0 6px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid #eee; }
    li small { color: #777; }
    button { border: none; background: none; color: #c33; cursor: pointer; font-size: 12px; }
    form { display: flex; gap: 6px; margin-top: 8px; }
    input[type=text] { flex: 1; padding: 4px 6px; }
    form button { color: #fff; background: #2563eb; border-radius: 4px; padding: 4px 10px; }
    .muted { color: #999; }
    .note { color: #777; font-size: 11px; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>Gesture Blocker</h1>
  <div id="current">
    <div class="host" id="host"></div>
    <label><input type="checkbox" id="swipe" /> Block swipe back/forward</label>
    <label><input type="checkbox" id="zoom" /> Block pinch-to-zoom</label>
    <div class="note">Also applies to subdomains.</div>
  </div>
  <h2>Blocked sites</h2>
  <ul id="list"></ul>
  <form id="add">
    <input type="text" id="newHost" placeholder="example.com" />
    <button type="submit">Add</button>
  </form>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
